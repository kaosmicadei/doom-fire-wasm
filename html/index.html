<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doom Fire WASM</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
        }

        #fire {
            margin-top: 100px;
            width: 400px;
            height: 200px;
            /* image-rendering: pixelated; */
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <canvas id="fire" width="100" height="50"></canvas>

    <script type="module">
        const fireColourPalette = [
            {"r":7,"g":7,"b":7},{"r":31,"g":7,"b":7},{"r":47,"g":15,"b":7},
            {"r":71,"g":15,"b":7},{"r":87,"g":23,"b":7},{"r":103,"g":31,"b":7},
            {"r":119,"g":31,"b":7},{"r":143,"g":39,"b":7},{"r":159,"g":47,"b":7},
            {"r":175,"g":63,"b":7},{"r":191,"g":71,"b":7},{"r":199,"g":71,"b":7},
            {"r":223,"g":79,"b":7},{"r":223,"g":87,"b":7},{"r":223,"g":87,"b":7},
            {"r":215,"g":95,"b":7},{"r":215,"g":95,"b":7},{"r":215,"g":103,"b":15},
            {"r":207,"g":111,"b":15},{"r":207,"g":119,"b":15},{"r":207,"g":127,"b":15},
            {"r":207,"g":135,"b":23},{"r":199,"g":135,"b":23},{"r":199,"g":143,"b":23},
            {"r":199,"g":151,"b":31},{"r":191,"g":159,"b":31},{"r":191,"g":159,"b":31},
            {"r":191,"g":167,"b":39},{"r":191,"g":167,"b":39},{"r":191,"g":175,"b":47},
            {"r":183,"g":175,"b":47},{"r":183,"g":183,"b":47},{"r":183,"g":183,"b":55},
            {"r":207,"g":207,"b":111},{"r":223,"g":223,"b":159},{"r":239,"g":239,"b":199},
            {"r":255,"g":255,"b":255}
        ]



        const wasm = await WebAssembly.instantiateStreaming(fetch("fire.wasm"));
        const doom_fire = wasm.instance.exports;

        const width = 100;
        const height = 50;

        doom_fire.set_fire_size(width, height);
        const fire = new Uint8Array(doom_fire.memory.buffer, doom_fire.img_addr(), width * height);
        window.fire = fire;
        const canvas = document.getElementById("fire");
        const ctx = canvas.getContext("2d");

        canvas.width = width;
        canvas.height = height;

        const imageData = ctx.createImageData(width, height);
        const pixels = imageData.data;

        function renderFire() {
            for (let i = 0; i < height * width; i++) {
                const j = i * 4;
                pixels[j] = fireColourPalette[fire[i]].r;      // Red
                pixels[j + 1] = fireColourPalette[fire[i]].g;  // Green
                pixels[j + 2] = fireColourPalette[fire[i]].b;  // Blue
                pixels[j + 3] = 255;                           // Alpha
            }
            ctx.putImageData(imageData, 0, 0);
        }

        let fps = 12;
        const stepInterval = 1000 / fps;   // milliseconds per frame

        let lastFrameTime = 0;

        function burn(timeStamp) {
            requestAnimationFrame(burn);

            if (timeStamp - lastFrameTime < stepInterval) return;

            lastFrameTime = timeStamp - ((timeStamp - lastFrameTime) % stepInterval);
            
            // update
            doom_fire.spread_the_fire();
            renderFire();
        }

        doom_fire.fire_starter();
        requestAnimationFrame(burn);
    </script>

</body>

</html>
